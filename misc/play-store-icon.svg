<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>AVR-Remote</title>
  <!-- Source for the 512x512 Play Store listing icon. The same artwork lives in three other places -
       change all four together:
         ../app/src/main/assets/icon.svg                     (README)
         ../docs/avr-icon.svg                                (GitHub Pages, byte-identical to the above)
         ../app/src/main/res/drawable/ic_launcher_foreground.xml  (and its API 24/25 twin in mipmap-anydpi/)
       Regenerate, from this directory (macOS - no rasterizer needed beyond QuickLook):
         qlmanage -t -s 512 -o . play-store-icon.svg && mv play-store-icon.svg.png play-store-icon-512.png -->

  <defs>
    <radialGradient id="dome" cx="42%" cy="42%" r="65%">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <!-- Opaque plate: the Play Store icon must not be transparent -->
  <rect x="0" y="0" width="100" height="100" fill="#000000"/>
  <!-- Chassis, with the grey rim of the original -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#666666" stroke-width="3"/>
  <!-- Surround: outer edge 35.8, inner edge 27.0 - a touch under the dome that covers it -->
  <circle cx="50" cy="50" r="31.4" fill="none" stroke="#ff0000" stroke-width="8.8"/>
  <!-- Dome -->
  <circle cx="50" cy="50" r="27.3" fill="url(#dome)"/>
</svg>
