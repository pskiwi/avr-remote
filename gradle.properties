android.useAndroidX=false
# R-Felder final halten, damit switch/case R.id.* in OptionsMenu.java weiter kompiliert
android.nonFinalResIds=false
org.gradle.jvmargs=-Xmx2048m
# AGP 8.13.0 ist nur bis compileSdk 36.1 getestet und warnt bei 37.2 in jedem Build.
# Kann weg, sobald ein AGP hier laeuft, das 37.x kennt.
android.suppressUnsupportedCompileSdk=37.2
