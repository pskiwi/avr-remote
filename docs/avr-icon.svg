<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>AVR-Remote</title>
  <defs>
    <radialGradient id="dome" cx="42%" cy="42%" r="65%">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
  </defs>
  <!-- Chassis, with the grey rim of the original -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#666666" stroke-width="3"/>
  <!-- Surround -->
  <circle cx="50" cy="50" r="27.4" fill="none" stroke="#ff0000" stroke-width="16.8"/>
  <!-- Dome -->
  <circle cx="50" cy="50" r="19.05" fill="url(#dome)"/>
</svg>
