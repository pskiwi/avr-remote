apply plugin: 'com.android.application'


// https://developer.android.com/studio/publish/app-signing
def keystorePropertiesFile = new File(System.getProperty("user.home"),"keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.canRead()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "de.pskiwi.avrremote"
    compileSdk 36

    defaultConfig {
        applicationId "de.pskiwi.avrremote"
        minSdk 24
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError = false
    }

    def fromEnv=System.getenv("KEY_PASSWORD")!=null && !System.getenv("KEY_PASSWORD").trim().isEmpty()
    if (keystorePropertiesFile.canRead() || fromEnv) {
        signingConfigs {
            release {
                if (fromEnv) {
                    keyAlias System.getenv("KEY_ALIAS")
                    keyPassword System.getenv("KEY_PASSWORD")
                    storeFile file(System.getenv("STORE_FILE"))
                    storePassword System.getenv("STORE_PASSWORD")
                } else {
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                    storeFile file(keystoreProperties['storeFile'])
                    storePassword keystoreProperties['storePassword']

                }
            }
        }

        buildTypes {
            release {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// ModelConfiguratorTest liest lists.xml direkt von der Platte, nicht über den
// Classpath. Ohne diese Zeile hält Gradle den Test für aktuell, wenn genau die
// Datei sich ändert, um die es dabei geht.
tasks.withType(Test).configureEach {
    inputs.file("src/main/res/values/lists.xml")
}


